---
layout: default
---
<article class="post"{% if page.lang %} lang="{{ page.lang }}"{% endif %}>
  <p class="kicker"><a href="{{ '/' | relative_url }}">Transformation Journeys</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
  <p class="post-meta">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </p>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
