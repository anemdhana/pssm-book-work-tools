<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="{{ '/assets/pssm-logo.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body>
  <div class="site-wrapper">
    <aside class="site-sidebar" aria-label="Main navigation">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/pssm-logo.png' | relative_url }}" alt="" width="56" height="56">
        <span class="brand-text">
          <strong>Pyramid Spiritual Societies Movement</strong>
          <em>{{ site.tagline }}</em>
        </span>
      </a>
      <nav class="side-nav" aria-label="Sections">
        <a href="{{ '/events/' | relative_url }}" {% if page.url contains '/events' %}aria-current="page"{% endif %}>Events</a>
        <a href="{{ '/knowledge-sharing/' | relative_url }}" {% if page.url contains '/knowledge-sharing' %}aria-current="page"{% endif %}>Knowledge Sharing</a>
        <a href="{{ '/transformation-journeys/' | relative_url }}" {% if page.url contains '/transformation-journeys' or page.url == '/' %}aria-current="page"{% endif %}>Transformation Journeys</a>
      </nav>
    </aside>

    <div class="site-content">
      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <img src="{{ '/assets/pssm-logo.png' | relative_url }}" alt="" width="36" height="36">
        <p>{{ site.tagline }}</p>
      </footer>
    </div>
  </div>
</body>
</html>
